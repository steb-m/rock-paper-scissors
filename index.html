<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Rock Paper Scissors</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <main>
            <header>
                <nav>
                    <ul>
                        <li><a href="#">Home</a></li>
                    </ul>
                </nav>

                <div>
                    <h1>Welcome to the Rock Paper Scissors Game!</h1>
                </div>
            </header>

            <section id="first_section">
                <div class="section_one_tittle">
                    <h2>Please select an option:</h2>
                </div>

                <div id="img_div">
                    <div>
                        <img
                            id="paper" src="img/paper.jpg" alt="Hand doing the paper sign"  onclick="onClick(this)"
                        >
                    </div>

                    <div>
                        <img id="rock" src="img/rock.jpg" alt="Hand doing the rock sign" onclick="onClick(this)"
                        >
                    </div>

                    <div>
                        <img id="scissors" src="img/sciser.jpg" alt="Hand doing the scissors sign" onclick="onClick(this)">
                    </div>
                </div>
            </section>

            <section id="second_section">
                <h3>Here is your track of the score!</h3>

                <p id="score">You - 0 | Computer - 0</p>

                <p id="result"></p>
            </section>
        </main>

        <script src="script.js"></script>
    </body>
</html>
